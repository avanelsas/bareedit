<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BareEditClj</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #app, .app { display: block; height: 100%; }
  .app { background: var(--x-color-bg); color: var(--x-color-text); font-family: var(--x-font-family, system-ui, sans-serif); }
  .panes { height: 100%; }
  .files { height: 100%; overflow: auto; padding: 4px 0; box-sizing: border-box;
           border-right: 1px solid var(--x-color-border); }
  .main { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  .main x-tabs { flex: none; border-bottom: 1px solid var(--x-color-border); padding: 0 4px; }
  #editor { flex: 1; min-height: 0; overflow: hidden; }
  .empty { padding: 24px; color: var(--x-color-text-muted); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .slot { display: contents; }
  .inner { height: 100%; }
  .inner.closed { --x-split-pane-divider-size: 0; }
  .results-pane { height: 100%; min-width: 0; border-left: 1px solid var(--x-color-border); }
  .inner.closed .results-pane { border: none; }
  .results { display: flex; flex-direction: column; height: 100%; }
  .results-bar { flex: none; display: flex; align-items: center; justify-content: space-between;
                 padding: 4px 8px; border-bottom: 1px solid var(--x-color-border);
                 color: var(--x-color-text-muted); }
  .entries { flex: 1; overflow: auto; }
  .entry { border-bottom: 1px solid var(--x-color-border); padding: 6px 8px; }
  .entry-head { display: flex; gap: 6px; align-items: baseline; font-size: 0.85em;
                color: var(--x-color-text-muted); white-space: nowrap; overflow: hidden; }
  .entry-head.jumps { cursor: pointer; }
  .entry-head.jumps:hover .title { color: var(--x-color-text); }
  .entry-head .title { overflow: hidden; text-overflow: ellipsis;
                       font-family: var(--x-font-family-mono, monospace); }
  .mark.ok { color: var(--x-color-success); }
  .mark.error, .mark.unavailable, .mark.no-runtime { color: var(--x-color-danger); }
  .mark.interrupted, .mark.running { color: var(--x-color-warning); }
  .entry-body pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word;
                    font-family: var(--x-font-family-mono, monospace); font-size: 0.9em; }
  .entry-body .err { color: var(--x-color-danger); }
  .entry-body .message { margin-top: 4px; color: var(--x-color-danger); font-size: 0.9em; }
  .entry-body x-button { margin-top: 4px; }
  .doc code { font-family: var(--x-font-family-mono, monospace); font-weight: bold; }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/main.js"></script>
</body>
</html>
