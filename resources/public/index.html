<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BareEdit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #app { display: block; height: 100%; }
  .app { display: flex; flex-direction: column; height: 100%; --bar-height: 2.5rem; --brand-blue: #79bde8;
         background: var(--x-color-bg); color: var(--x-color-text);
         font-family: var(--x-font-family, system-ui, sans-serif);
         /* inherited, also inside the components, so every scrollbar takes the theme's colours */
         scrollbar-color: var(--x-color-border) transparent; }
  .panes { flex: 1; min-height: 0; }
  .status-bar { flex: none; display: flex; align-items: center; gap: 1rem; height: 1.625rem;
                padding: 0 0.75rem; border-top: 1px solid var(--x-color-border);
                font-size: 0.8rem; color: var(--x-color-text-muted); white-space: nowrap; overflow: hidden; }
  .status-bar .project { color: var(--x-color-text); font-weight: 600; }
  .status-bar .read-only { padding: 0 0.375rem; border: 1px solid var(--x-color-border); border-radius: 3px; }
  /* a dot's tone comes from the page's conn-states and repl-states */
  .status-bar .dot::before { content: "●"; margin-right: 0.25rem; }
  .status-bar .dot.ok::before   { color: var(--x-color-success); }
  .status-bar .dot.busy::before { color: var(--x-color-warning); }
  .status-bar .dot.bad::before  { color: var(--x-color-danger); }
  .status-bar .dot.idle::before { opacity: 0.4; }
  .status-bar .fill { flex: 1; }
  .files { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  /* the three bars share one height and one bottom line, so their lines meet */
  .bar { flex: none; height: var(--bar-height); box-sizing: border-box;
         border-bottom: 1px solid var(--x-color-border); }
  .files-bar { display: flex; align-items: center; padding: 0 0.75rem; }
  .brand { font-family: 'JetBrains Mono', var(--x-font-family-mono, monospace); font-size: 1.05rem;
           color: var(--x-color-text); white-space: nowrap; }
  .brand .bracket { color: var(--brand-blue); }
  .tree { flex: 1; min-height: 0; overflow: auto; padding: 0.25rem 0; }
  .files x-tree { --x-tree-row-height: 1.625rem; --x-tree-gap: 0.25rem; }
  .main { display: flex; flex-direction: column; height: 100%; min-width: 0; }
  .main x-tabs { display: flex; align-items: flex-end; padding: 0 0.25rem; }
  .main x-tab { --x-tab-selected-background: var(--x-color-surface-hover); }
  .tab-close { margin-left: 0.375rem; padding: 0 0.25rem; border-radius: 3px; opacity: 0.5; cursor: pointer; }
  .tab-close:hover { opacity: 1; background: var(--x-color-surface-active); }
  #editor { flex: 1; min-height: 0; overflow: hidden; }
  .empty { padding: 1.5rem; color: var(--x-color-text-muted); }
  .main .empty { flex: 1; }
  .find-bar { flex: none; display: flex; flex-direction: column; gap: 0.375rem; padding: 0.375rem 0.5rem;
              border-top: 1px solid var(--x-color-border); }
  .find-row { display: flex; align-items: center; gap: 0.375rem; min-width: 0; }
  .find-row x-search-field { flex: 1; min-width: 6rem; }
  .find-row x-form-field { flex: 1; min-width: 6rem; }
  .find-status { flex: none; margin: 0 0.25rem; color: var(--x-color-text-muted); white-space: nowrap; }
  .find-options { display: flex; align-items: center; gap: 1rem; min-width: 0; white-space: nowrap;
                  color: var(--x-color-text-muted); font-size: 0.9rem; }
  .find-options .option { --x-checkbox-label-gap: 0.375rem; cursor: pointer; }
  .find-options .fill { flex: 1; }
  .find-summary { overflow: hidden; text-overflow: ellipsis; }
  .find-hits { max-height: 40vh; overflow: auto; }
  .hit-head { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.125rem 0.25rem; cursor: pointer;
              white-space: nowrap; border-radius: 3px; }
  .hit-head:hover { background: var(--x-color-surface-hover); }
  .hit-head .fold { width: 1em; color: var(--x-color-text-muted); }
  .hit-name { font-weight: 600; }
  .hit-folder { color: var(--x-color-text-muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; }
  .hit-head .fill { flex: 1; }
  .hit-count { color: var(--x-color-text-muted); font-size: 0.85rem; }
  .hit { display: flex; gap: 0.75rem; padding: 0.0625rem 0.25rem 0.0625rem 1.5rem; border-radius: 3px;
         cursor: pointer; white-space: nowrap; font-family: var(--x-font-family-mono, monospace); font-size: 0.9rem; }
  .hit:hover, .hit.at { background: var(--x-color-surface-hover); }
  .hit.at { box-shadow: inset 2px 0 var(--x-color-primary); }
  .hit-line { flex: none; min-width: 3ch; text-align: right; color: var(--x-color-text-muted); }
  .hit-text { overflow: hidden; text-overflow: ellipsis; }
  .hit-text mark { color: inherit; border-radius: 2px;
                   background: color-mix(in srgb, var(--x-color-warning) 35%, transparent); }
  .actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
  .slot { display: contents; }
  .inner { height: 100%; }
  .inner.closed { --x-split-pane-divider-size: 0; }
  /* the bars' bottom line runs on through each divider's grab area, so the lines meet */
  .panes::part(divider), .inner::part(divider) {
    background: linear-gradient(var(--x-color-border), var(--x-color-border))
                0 calc(var(--bar-height) - 1px) / 100% 1px no-repeat; }
  .results-pane { height: 100%; min-width: 0; }
  .results { display: flex; flex-direction: column; height: 100%; }
  .results-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 0.5rem;
                 color: var(--x-color-text-muted); }
  .entries { flex: 1; overflow: auto; font-size: var(--x-font-size-base, 1rem); }
  .entry { border-bottom: 1px solid var(--x-color-border); padding: 0.375rem 0.5rem; }
  .entry-head { display: flex; gap: 0.375rem; align-items: baseline; font-size: 0.85em;
                color: var(--x-color-text-muted); white-space: nowrap; overflow: hidden; }
  .entry-head.jumps { cursor: pointer; }
  .entry-head.jumps:hover .title { color: var(--x-color-text); }
  .entry-head .title { overflow: hidden; text-overflow: ellipsis;
                       font-family: var(--x-font-family-mono, monospace); }
  .mark.ok { color: var(--x-color-success); }
  .mark.error, .mark.unavailable, .mark.no-runtime { color: var(--x-color-danger); }
  .mark.interrupted, .mark.running { color: var(--x-color-warning); }
  .entry-body pre { margin: 0.25rem 0 0; white-space: pre-wrap; word-break: break-word;
                    font-family: var(--x-font-family-mono, monospace); font-size: 0.9em; }
  .entry-body .err { color: var(--x-color-danger); }
  .entry-body .message { margin-top: 0.25rem; color: var(--x-color-danger); font-size: 0.9em; }
  .entry-body x-button { margin-top: 0.25rem; }
  .doc code { font-family: var(--x-font-family-mono, monospace); font-weight: bold; }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/main.js"></script>
</body>
</html>
